name: CPU artifact checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m black --check src tests scripts
      - run: python -m pytest
      - run: python scripts/audit_release.py
      - run: fastset paper-figures --output results/ci_figures

